name: Android ARM64 Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rexglue/rexglue-sdk
          ref: c94f5ebdcb3c9d1a460ca48e04f9758448f8d518
          path: .private-upload/rexglue-sdk

      - uses: actions/checkout@v4
        with:
          repository: RamiChaaben8/Fifa_World_Cup_2010_PC_Port
          ref: 7ca2bea8675ccc4dda4b911938a0110a32a5ac27
          path: .private-upload/fifa-pc-port-src

      - name: Generate FIFA native sources
        shell: bash
        run: |
          set -euo pipefail
          GAME_DATA="$GITHUB_WORKSPACE/.private-upload/game-extracted"
          TEMPLATE="$GITHUB_WORKSPACE/.private-upload/fifa-pc-port-src/Installer/recomp-template"
          SDK="$GITHUB_WORKSPACE/.private-upload/rexglue-sdk"
          test -f "$GAME_DATA/default.xex"
          test -f "$GAME_DATA/fifadllzf.xex"
          cmake -S "$SDK" -B /tmp/rexglue-host -DCMAKE_BUILD_TYPE=Release -DREXGLUE_USE_VULKAN=OFF -DREXGLUE_USE_D3D12=OFF
          cmake --build /tmp/rexglue-host --target rexglue --parallel 2
          cat > "$TEMPLATE/worldcup2010_manifest.toml" <<EOF
          [project]
          name = "worldcup2010"
          sdk_version = "0.10.0"
          game_root = "$GAME_DATA"
          [entrypoint]
          file_path = "$GAME_DATA/default.xex"
          out_directory_path = "generated/default"
          includes = ["config/default_overrides.toml"]
          [[modules]]
          guest_path = "game:\\fifadllzf.xex"
          file_path = "$GAME_DATA/fifadllzf.xex"
          out_directory_path = "generated/fifadllzf_xex"
          includes = ["config/fifadllzf_overrides.toml"]
          EOF
          "$SDK/out/linux-amd64/rexglue" codegen "$TEMPLATE/worldcup2010_manifest.toml"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.30.3'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build ARM64 APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FIFA-World-Cup-2010-Android-APK
          path: app/build/outputs/apk/debug/*.apk
